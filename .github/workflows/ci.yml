name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows-package:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri build
      - run: npm run package:portable -- -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-saver-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/Prompt-Saver-portable-x64.zip
